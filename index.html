/* Layout: one column board. Tab strip on top, area tabs hold collapsible section cards with Task / Execution / Deadline / Today columns; Today tab pulls toggled tasks grouped by area and section. Dark-first. */
:root{
  --bg:#13161d; --surface:#1b1f28; --surface-2:#232835; --line:#2f3544;
  --fg:#e8eaf0; --muted:#9097a8; --faint:#646b7d;
  --sun:#f0b84a; --sun-ink:#2a1d00; --sun-soft:rgba(240,184,74,.14);
  --danger:#ef7b6f; --warn:#e9b25a; --ok:#7cc59a;
  --display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f4f5f8; --line:#dde0e8;
  --fg:#1a1d26; --muted:#5d6475; --faint:#8a90a0;
  --sun:#b57a06; --sun-ink:#ffffff; --sun-soft:rgba(214,150,20,.13);
  --danger:#c8463a; --warn:#a86d07; --ok:#2f8a57; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f4f5f8; --line:#dde0e8;
  --fg:#1a1d26; --muted:#5d6475; --faint:#8a90a0;
  --sun:#b57a06; --sun-ink:#ffffff; --sun-soft:rgba(214,150,20,.13);
  --danger:#c8463a; --warn:#a86d07; --ok:#2f8a57; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin:0}
.brand h1 span{color:var(--sun)}
.logo{display:flex;flex-direction:column;gap:0}
.logo h1{line-height:1.05}
.tagline{margin:2px 0 0;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.sync{font-size:.8rem;color:var(--faint);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.on i{background:var(--ok)}
.sync.busy i{background:var(--warn)}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:1px solid transparent;border-bottom:none;background:none;
  padding:9px 14px 10px;border-radius:10px 10px 0 0;color:var(--muted);font-weight:700;white-space:nowrap;position:relative;top:1px}
.tab:hover{color:var(--fg)}
.tab.active{background:var(--surface);border-color:var(--line);color:var(--fg)}
.tab .dot{width:9px;height:9px;border-radius:50%}
.tab .badge{font-size:.72rem;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:0 7px;line-height:1.5;font-variant-numeric:tabular-nums}
.tab.add{color:var(--faint);font-size:1.2rem;padding:6px 12px 8px}
.tab-new{flex:none;display:flex;align-items:center;padding:4px 6px}
.tab-new input{width:130px;background:var(--surface);border:1px solid var(--sun);border-radius:8px;padding:6px 10px}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);padding:18px 16px 20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-head h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance}
.panel-head .sub{color:var(--muted);font-size:.88rem}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--muted);font-size:.88rem}
.ghost:hover{color:var(--fg);border-color:var(--faint)}

.section{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden;background:var(--bg)}
.sec-head{display:flex;align-items:center;gap:6px;background:var(--surface-2);padding:4px 6px 4px 4px}
.sec-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:none;padding:8px 6px;text-align:left;font-weight:700}
.sec-toggle .chev{width:0;height:0;border-left:7px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
.section:not(.collapsed) .chev{transform:rotate(90deg)}
.sec-toggle .count{color:var(--faint);font-weight:400;font-size:.85rem;font-variant-numeric:tabular-nums}
.sec-toggle .crumb{color:var(--muted);font-weight:400}
.icon-btn{background:none;border:none;color:var(--faint);border-radius:6px;padding:4px 8px;font-size:1.05rem;line-height:1}
.icon-btn:hover{color:var(--fg);background:var(--line)}
.section.collapsed .sec-body{display:none}

.cols,.row{display:grid;grid-template-columns:18px 26px minmax(0,1fr) 54px;align-items:center;column-gap:8px}
.cols{padding:6px 10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);border-bottom:1px solid var(--line)}
.cols .c-date{display:none}
.cols .c-today{text-align:center}
ul.list{list-style:none;margin:0;padding:0;min-height:6px}
.row{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.row.is-today{background:linear-gradient(90deg,var(--sun-soft),transparent 70%)}
.grip{color:var(--faint);cursor:grab;touch-action:none;user-select:none;font-size:.9rem;letter-spacing:-2px;text-align:center}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);background:none;padding:0;display:grid;place-items:center}
.check:hover{border-color:var(--ok)}
.done .check{background:var(--ok);border-color:var(--ok)}
.done .check::after{content:"";width:6px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.title{min-width:0}
.title button{background:none;border:none;padding:0;text-align:left;width:100%;overflow-wrap:anywhere}
.done .title button{text-decoration:line-through;color:var(--faint)}
.sample{font-size:.68rem;border:1px solid var(--line);color:var(--faint);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);margin-top:2px}
.meta button{background:none;border:none;padding:0;color:inherit;font-variant-numeric:tabular-nums}
.meta b{font-weight:400;color:var(--faint)}
.d-cell{display:none;background:none;border:none;padding:4px 0;text-align:left;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.d-cell.empty,.meta .empty{color:var(--faint)}
.late{color:var(--danger)!important;font-weight:700}
.soon{color:var(--warn)!important}
.started{color:var(--sun)!important}

.switch{justify-self:center;width:44px;height:26px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:2px;position:relative}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--faint);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--sun);border-color:var(--sun)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--sun-ink)}

.add-row{display:flex;align-items:center;gap:8px;padding:6px 10px 8px 36px}
.add-row input{flex:1;min-width:0;background:none;border:none;border-bottom:1px dashed var(--line);padding:6px 2px;color:var(--fg)}
.add-row input::placeholder{color:var(--faint)}
.add-row input:focus{outline:none;border-bottom-color:var(--sun)}
.done-fold{border-top:1px solid var(--line)}
.done-fold summary{cursor:pointer;padding:7px 10px 7px 36px;font-size:.85rem;color:var(--faint)}
.done-fold .clear{float:right;background:none;border:none;color:var(--faint);font-size:.8rem;text-decoration:underline}
.add-section{width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:12px;color:var(--muted)}
.add-section:hover{border-color:var(--faint);color:var(--fg)}
.done-link{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:8px 10px 8px 36px;font-size:.85rem;color:var(--faint)}
.done-link:hover{color:var(--ok)}
.tab .tick{color:var(--ok);font-size:.9rem}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.filters .field{flex:1 1 140px;min-width:0}
.filters select:disabled{opacity:.5}
.filters .reset{flex:none;padding:9px 12px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:600;font-size:1rem;margin:16px 0 6px}
.day-head span:last-child{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--faint);font-variant-numeric:tabular-nums}
.done-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.done-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.done-row:last-child{border-bottom:none}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on::after{content:"";width:6px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check.on:hover{background:none}
.check.on:hover::after{border-color:var(--ok)}
.done-row .dt{overflow-wrap:anywhere}
.meta2{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:.8rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.crumb2{display:inline-flex;align-items:center;gap:6px}
.crumb2 .dot{width:8px;height:8px;border-radius:50%}
.ontime{color:var(--ok)}
.taken{color:var(--fg);font-weight:700}
.icon-btn.armed{color:var(--bg);background:var(--danger);font-size:.8rem}
.t-cell{display:none;min-width:0}
.exp{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 6px;background:none;border:none;padding:0;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;text-align:left}
.exp.empty{color:var(--faint)}
.exp .lbl{color:var(--faint)}
.exp:hover{color:var(--fg)}
.timer{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.timer .play{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--faint);background:none;padding:0;position:relative}
.timer .play::after{content:"";position:absolute;left:8px;top:6px;border-left:8px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent}
.timer .play:hover{border-color:var(--sun)}
.timer .play:disabled{opacity:.35;cursor:default}
.timer.run .play{background:var(--sun);border-color:var(--sun)}
.timer.run .play::after{left:7px;top:6px;width:8px;height:10px;border:solid var(--sun-ink);border-width:0 3px;box-sizing:border-box}
.timer .tval{background:none;border:none;padding:0;color:inherit;font-variant-numeric:tabular-nums}
.timer.run .tval{color:var(--sun);font-weight:700}
.timer .te{color:var(--faint);font-weight:400}
.timer.over .tval span:first-child{color:var(--warn)}
.pdots{display:inline-flex;gap:3px}
.pdots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--faint)}
.pdots i.f{background:var(--danger);border-color:var(--danger)}
.pdots i.x{border-style:dashed}
.row.running{box-shadow:inset 3px 0 0 var(--sun)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;max-width:min(440px,calc(100vw - 32px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.timer .fz{background:none;border:none;color:var(--faint);padding:2px;display:inline-grid;place-items:center;border-radius:4px}
.timer .fz:hover{color:var(--sun)}
body.focusing{overflow:hidden}
.focus{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.f-top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.9rem}
.f-x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 14px}
.f-x:hover{color:var(--fg);border-color:var(--faint)}
.f-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;min-height:0}
.f-title{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,4vw,2.2rem);margin:0;max-width:24ch;text-wrap:balance;overflow-wrap:anywhere}
.f-clock{font-family:var(--display);font-weight:800;font-size:clamp(4.2rem,20vw,11rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--muted)}
.f-clock.run{color:var(--sun)}
.f-clock.over{color:var(--warn)}
.f-sub{color:var(--muted)}
.f-pomo{display:grid;gap:10px;justify-items:center;width:min(360px,100%)}
.f-dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.f-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--faint)}
.f-dots i.f{background:var(--danger);border-color:var(--danger)}
.f-dots i.cur{border-color:var(--danger)}
.f-dots i.x{border-style:dashed}
.f-bar{width:100%;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.f-bar span{display:block;height:100%;background:var(--danger);border-radius:inherit;transition:width 1s linear}
.f-left{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.f-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.f-btn{min-width:140px;padding:14px 22px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem}
.f-btn.primary{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.brand-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.pomo-set{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.old-banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:14px 0 0;padding:14px 16px;border:1px solid var(--sun);background:var(--sun-soft);border-radius:var(--r)}
.old-banner div:first-child{display:grid;gap:2px;min-width:0;flex:1 1 260px}
.old-banner span{color:var(--muted);font-size:.88rem}
.ob-actions{display:flex;gap:8px}
.acct{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:.8rem;color:var(--muted)}
.acct .av{width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;font-weight:700;font-size:.72rem}
.acct.armed{color:var(--danger);border-color:var(--danger);padding-left:10px}
.gate{min-height:100vh;display:grid;place-items:center;padding-block:24px}
.gate-card{max-width:380px;width:100%;text-align:center;display:grid;gap:10px;justify-items:center}
.gate-logo{font-family:var(--display);font-weight:800;font-size:3.4rem;letter-spacing:-.03em;margin:0;line-height:1}
.gate-logo span{color:var(--sun)}
.gate-txt{font-family:var(--display);font-weight:600;font-size:1.35rem;color:var(--fg);margin:10px 0 14px;text-wrap:balance}
.gate-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 18px;font-weight:700;font-size:1rem}
.gate-btn:hover{border-color:var(--sun)}
.gate-err{color:var(--danger);margin:0;min-height:1.2em;font-size:.9rem}
.gate-credit{margin:0 0 6px;font-size:.85rem;color:var(--muted);letter-spacing:.02em;line-height:1.5}
.gate-credit b{color:var(--sun);font-weight:700}
.gate-note{color:var(--faint);font-size:.82rem;margin:0}
.imp-btn{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--sun-ink);border:none;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:none;border-radius:7px;padding:8px;color:var(--muted);font-weight:700}
.seg button[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}
.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;font:inherit;color:inherit;resize:vertical;min-height:160px}
.drop{display:grid;place-items:center;min-height:160px;border:1.5px dashed var(--line);border-radius:10px;cursor:pointer;color:var(--muted);text-align:center;padding:12px;overflow:hidden}
.drop:hover{border-color:var(--sun)}
.drop img{max-height:260px;border-radius:6px}
.err{color:var(--danger);margin:0;font-size:.9rem}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.bulk .field{flex:1 1 180px;min-width:0}
.bulk .ghost{padding:9px 14px}
.selall{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted);padding-bottom:9px}
.selall:last-of-type{padding-bottom:0}
.imp-list{list-style:none;margin:0;padding:0;max-height:min(46vh,420px);overflow:auto;border:1px solid var(--line);border-radius:10px}
.imp-list li{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,190px) 28px;gap:8px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line)}
.imp-list li:last-child{border-bottom:none}
.imp-list .imp-title{background:none;border:none;border-bottom:1px dashed transparent;padding:4px 2px;min-width:0;width:100%}
.imp-list .imp-title:focus{outline:none;border-bottom-color:var(--sun)}
.imp-new{grid-column:2/-1;display:flex;gap:8px}
.imp-new input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--sun);border-radius:7px;padding:6px 8px}

<script>
(() => {

    {id:"s3",tabId:"res",name:"Papers",collapsed:false},{id:"s4",tabId:"kit",name:"Groceries",collapsed:false},
    {id:"s5",tabId:"biz",name:"General",collapsed:false}];

    k("s1","Mark tutorial submissions",addDays(2,10),addDays(5,17),false,1),
    k("s2","Reply to co-author comments",addDays(0,16),addDays(1,12),true,0),
    k("s3","Revise literature review section",addDays(3,9),addDays(10,17),false,0),
    k("s4","Restock rice and eggs","",addDays(1,19),false,0),

function starterPublic(){

  const s=[{id:"w1",tabId:"work",name:"Projects",collapsed:false},{id:"w2",tabId:"work",name:"Admin",collapsed:false},
    {id:"h1",tabId:"home",name:"Chores",collapsed:false},{id:"h2",tabId:"home",name:"Errands",collapsed:false},
    {id:"l1",tabId:"leisure",name:"Hobbies",collapsed:false}];
  const k=(sectionId,title,exec,due,today,order,p)=>({id:uid(),sectionId,title,exec,due,today,done:false,auto:!!today,order,sample:true,estP:p,spent:0});
  return {v:1,activeTab:"today",settings:{work:10,brk:5},tabs:t,sections:s,tasks:[
    k("w1","Plan this week's priorities",addDays(0,9),addDays(0,17),true,0,2),
    k("w2","Reply to important emails",addDays(0,14),addDays(1,12),true,0,1),
    k("h1","Laundry","",addDays(1,20),false,0,2),
    k("h2","Buy groceries","",addDays(2,19),false,0,1),
    k("l1","Go for a walk or run",addDays(1,18),"",false,0,3)]};
}
let S = null;
let LS = "gerak-board-v1";
function loadLocal(){ try{ const j=localStorage.getItem(LS); return j?JSON.parse(j):null }catch(e){ return null } }
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(S)) }catch(e){} }

/* ---------- persistence ---------- */
let ref=null, timer=null, writing=false, dirty=false, lastRemote="";
const syncEl = document.getElementById("sync");
function setSync(cls,text){ syncEl.className="sync "+cls; syncEl.querySelector("span").textContent=text; }
function commitNow(){ commit(); clearTimeout(timer); timer=null; flush(); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&dirty){ clearTimeout(timer); timer=null; flush(); } });
window.addEventListener("pagehide",()=>{ if(dirty){ clearTimeout(timer); timer=null; flush(); } });
window.addEventListener("blur",()=>{ if(dirty){ clearTimeout(timer); timer=null; flush(); } });
function commit(){ saveLocal(); render(); if(!ref){ setSync("","Saved on this device"); return; }
  dirty=true; setSync("busy","Saving…"); clearTimeout(timer); timer=setTimeout(()=>{ timer=null; flush(); },400); }
/* 3-way merge: keep only what THIS device changed since it last synced,
   on top of whatever the other devices saved meanwhile. */
let base=null;
const J=v=>JSON.stringify(v===undefined?null:v);
function mergeObj(b,l,r){
  b=b||{}; l=l||{}; r=r||{}; const out={};
  const keys=new Set([...Object.keys(b),...Object.keys(l),...Object.keys(r)]);
  for(const k of keys){
    const v=J(l[k])!==J(b[k])?l[k]:r[k];
    if(v!==undefined&&v!==null) out[k]=v;
  }
  return out;
}
function mergeList(b,l,r){
  b=b||[]; l=l||[]; r=r||[];
  const B=new Map(b.map(x=>[x.id,x])), L=new Map(l.map(x=>[x.id,x])), R=new Map(r.map(x=>[x.id,x]));
  const delLocal=id=>B.has(id)&&!L.has(id), delRemote=id=>B.has(id)&&!R.has(id);
  const changedLocal=id=>L.has(id)&&(!B.has(id)||J(L.get(id))!==J(B.get(id)));
  const keep=id=>!delLocal(id)&&!(delRemote(id)&&!changedLocal(id));
  const localReordered=J(l.map(x=>x.id))!==J(b.map(x=>x.id));
  const first=localReordered?l:r, second=localReordered?r:l;
  const ids=[]; const seen=new Set();
  for(const x of [...first,...second]){ if(seen.has(x.id)) continue; seen.add(x.id); if(keep(x.id)) ids.push(x.id); }
  return ids.map(id=> L.has(id)&&R.has(id)?mergeObj(B.get(id),L.get(id),R.get(id)) : (L.get(id)||R.get(id)));
}
function mergeState(b,l,r){
  b=b||{};
  const rest=k=>{ const o={...k}; delete o.tabs; delete o.sections; delete o.tasks; delete o.settings; return o; };
  const out=mergeObj(rest(b),rest(l),rest(r));
  out.tabs=mergeList(b.tabs,l.tabs,r.tabs);
  out.sections=mergeList(b.sections,l.sections,r.sections);
  out.tasks=mergeList(b.tasks,l.tasks,r.tasks);
  out.settings=mergeObj(b.settings,l.settings,r.settings);
  out.activeTab=l.activeTab;
  return out;
}
function takeMerged(body,sentLocal){
  // body = what is now saved; sentLocal = our state when we started saving
  const saved=JSON.parse(body), keepTab=S.activeTab;
  const next=dirty?mergeState(sentLocal,S,saved):saved;
  next.activeTab=keepTab; base=JSON.parse(body); lastRemote=body;
  const changed=J(next)!==J(S); S=next; normalize(); saveLocal(); if(changed) render();
}
async function flush(){
  if(!ref||writing||!dirty||!ready) return;
  writing=true; dirty=false;
  const sentLocal=JSON.parse(JSON.stringify(S));
  try{
    const body=await ref.mergeWrite(remoteBody=>{
      let remote=null; try{ remote=typeof remoteBody==="string"?JSON.parse(remoteBody):null; }catch(e){}
      return JSON.stringify(remote&&base?mergeState(base,sentLocal,remote):sentLocal);
    });
    takeMerged(body,sentLocal); setSync("on","Synced");
  }catch(e){ dirty=true; setSync("","Saved on this device. Sync paused"); }
  writing=false; if(dirty) flush();
}
let ready=false, unsub=null, me=null;
function adopt(body){
  try{ const keepTab=S.activeTab; S=JSON.parse(body); base=JSON.parse(body); normalize();
    if(!S.tabs.some(t=>t.id===keepTab)&&keepTab!=="today"&&keepTab!=="done"&&keepTab!=="upcoming") S.activeTab="today"; else S.activeTab=keepTab;
    saveLocal(); render(); setSync("on","Synced"); }catch(e){}
}
function listen(){
  let first=true; ready=false;
  unsub=ref.onSnapshot(snap=>{
    if(first){
      if(!snap.exists&&snap.metadata?.fromCache) return;

      if(!snap.exists){ dirty=true; flush(); return; }

    }
    if(!snap.exists||snap.metadata?.hasPendingWrites) return;
    const body=snap.data()?.state; if(typeof body!=="string"||body===lastRemote) return;

  },()=>setSync("","Saved on this device. Sync paused"));

const FBC=window.GERAK_FIREBASE;
const FB_ON=!!(window.firebase&&FBC&&FBC.apiKey&&!/PASTE/i.test(FBC.apiKey));
function connect(){ return FB_ON?connectFirebase():connectClaude(); }
async function connectClaude(){
  if(!window.claude?.use) { ready=true; setSync("","Saved on this device"); return; }
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){ ready=true; setSync("","Saved on this device"); return; }
    const id=await user.id(); if(!id){ ready=true; setSync("","Saved on this device"); return; }

  const pool=S.tasks.filter(t=>{ if(t.done||!keyOf(t)) return false; const s=secOf(t.sectionId); if(!s) return false;
    if(UF.tab!=="all"&&s.tabId!==UF.tab) return false; if(UF.sec!=="all"&&s.id!==UF.sec) return false; return true; });
  const overdue=pool.filter(t=>byDue?new Date(t.due)<nowMs():dayKey(t.exec)<today).sort((a,b)=>new Date(keyOf(a))-new Date(keyOf(b)));
  const list=pool.filter(t=>!overdue.includes(t)&&dayKey(keyOf(t))>=today&&inR(dayKey(keyOf(t))))
    .sort((a,b)=>new Date(keyOf(a))-new Date(keyOf(b))||(b.urgent?1:0)-(a.urgent?1:0));
  let h=`<div class="panel-head"><div><h2>Upcoming</h2><div class="sub">${list.length} planned${overdue.length?` · ${overdue.length} ${byDue?"overdue":"start date passed"}`:""}</div></div></div>

    ${UF.range==="custom"?`<div class="field"><label for="uf-from">From</label><input type="date" id="uf-from" data-uf="from" value="${UF.from}"></div>
      <div class="field"><label for="uf-to">To</label><input type="date" id="uf-to" data-uf="to" value="${UF.to}"></div>`:""}
    <div class="field"><label for="uf-tab">Header</label><select id="uf-tab" data-uf="tab"><option value="all">All tabs</option>
      ${S.tabs.map(t=>`<option value="${t.id}" ${UF.tab===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div>
    <div class="field"><label for="uf-sec">Sub-header</label><select id="uf-sec" data-uf="sec" ${UF.tab==="all"?"disabled":""}><option value="all">All sections</option>
      ${secsOfTab.map(s=>`<option value="${s.id}" ${UF.sec===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>
    ${UF.range!=="all"||UF.tab!=="all"?`<button type="button" class="ghost reset" data-act="resetUF">Reset</button>`:""}
  </div>`;
  const prow=t=>{ const s=secOf(t.sectionId), tab=tabOf(s.tabId);
    return `<li class="plan-row ${t.urgent?"urgent":""}" data-id="${t.id}">
      <button class="check" data-act="done" aria-label="Mark done"></button>
      <div class="title"><button class="t-name" data-act="edit" data-focus="exec">${t.urgent?'<span class="urg-pill">Urgent</span>':""}${esc(t.title)}${t.recur&&t.recur!=="none"?`<span class="rec" title="${RECUR[t.recur]}">↻</span>`:""}</button>
        <div class="meta2"><span class="crumb2"><span class="dot" style="background:${tab.color}"></span>${esc(tab.name)} · ${esc(s.name)}</span>${t.exec?`<span class="${execClass(t)}">Start ${fmt(t.exec)}</span>`:""}${t.due?`<span class="${dueClass(t)}">Due ${fmt(t.due)}</span>`:""}${estP(t)?`<span>Exp ${fmtMin(estMin(t))}</span>`:""}</div></div>
      <button class="switch" role="switch" aria-checked="${!!t.today}" aria-label="Show in Today" data-act="today"></button></li>`; };
  if(!overdue.length&&!list.length){
    h+=`<div class="empty-state"><div class="sunmark"></div><strong>${pool.length?"Nothing planned for these filters":"No planned tasks yet"}</strong>${pool.length?"Try a wider date range or another tab.":byDue?"Give a task a deadline and it shows up here.":"Give a task an execution date and it shows up here."}</div>`;
  }
  if(overdue.length){ h+=`<div class="day-head late-head"><span>${byDue?"Overdue":"Start date passed, not done yet"}</span><span>${overdue.length}</span></div><ul class="list done-list">${overdue.map(prow).join("")}</ul>`; }
  let cur="";
  for(const t of list){ const k=dayKey(keyOf(t));
    if(k!==cur){ if(cur) h+=`</ul>`; cur=k; const d=new Date(keyOf(t)), n=list.filter(x=>dayKey(keyOf(x))===k).length;
      const tm=new Date(); tm.setDate(tm.getDate()+1);
      const lbl=k===today?"Today":k===dayKey(tm)?"Tomorrow":d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
      h+=`<div class="day-head"><span>${lbl}</span><span>${n} ${byDue?"due":"to start"}</span></div><ul class="list done-list">`; }
    h+=prow(t); }

  panel.innerHTML=h;

function isToday(v){ if(!v) return false; const a=new Date(v), b=new Date(); return a.toDateString()===b.toDateString(); }

/* ---------- drag to move ---------- */
let sortables=[];
function bindSortables(){
  sortables.forEach(s=>s.destroy()); sortables=[];
  if(!window.Sortable) return;
  panel.querySelectorAll(".sec-list").forEach(box=>{
    sortables.push(Sortable.create(box,{handle:".sec-grip",draggable:".section",animation:150,group:"sections",
      onEnd(){
        const tid=box.dataset.tab, ids=[...box.querySelectorAll(":scope > .section")].map(el=>el.dataset.sec);
        const mine=ids.map(id=>secOf(id)).filter(Boolean);
        const out=[]; let placed=false;
        for(const x of S.sections){ if(x.tabId===tid){ if(!placed){ out.push(...mine); placed=true; } } else out.push(x); }
        S.sections=out; commit();
      }}));
  });
  panel.querySelectorAll('ul.list[data-list="area"],ul.list[data-list="today"]').forEach(ul=>{
    const isToday=ul.dataset.list==="today";
    sortables.push(Sortable.create(ul,{
      group: isToday?{name:"today",pull:false,put:false}:"area",
      handle:".grip", animation:150, delay:0, forceFallback:true, fallbackOnBody:true, fallbackTolerance:3,
      onStart(){ dragStart(); },
      onEnd(ev){
        const hit=dragStop(), moving=taskOf(ev.item.dataset.id);
        if(hit&&moving&&dropOn(moving,hit)){ commit(); return; }
        if(isToday){ [...ul.querySelectorAll("li.row")].forEach((li,i)=>{ const x=taskOf(li.dataset.id); if(x) x.todayOrder=i; }); commit(); return; }
        const target=ev.to, sid=target.dataset.sec;
        const ids=[...target.querySelectorAll("li.row")].map(li=>li.dataset.id);
        const moved=taskOf(ev.item.dataset.id);
        if(moved && moved.sectionId!==sid){ moved.sectionId=sid; moved.order=1e9; }
        reorder(sid,ids);
        if(ev.from!==ev.to) reorder(ev.from.dataset.sec,[...ev.from.querySelectorAll("li.row")].map(li=>li.dataset.id));
        commit();
      }}));
  });
}
let hotEl=null;
function dragTrack(e){
  const p=e.touches?e.touches[0]:e; if(!p) return;
  const el=document.elementFromPoint(p.clientX,p.clientY)?.closest("[data-drop]")||null;
  if(el!==hotEl){ hotEl&&hotEl.classList.remove("drop-hot"); hotEl=el; el&&el.classList.add("drop-hot"); }
}
function dragStart(){ document.body.classList.add("dragging"); ["mousemove","touchmove","pointermove"].forEach(n=>document.addEventListener(n,dragTrack,{passive:true})); }
function dragStop(){ ["mousemove","touchmove","pointermove"].forEach(n=>document.removeEventListener(n,dragTrack)); document.body.classList.remove("dragging");
  const el=hotEl; hotEl&&hotEl.classList.remove("drop-hot"); hotEl=null; return el; }
function dropOn(t,el){
  const kind=el.dataset.drop, id=el.dataset.id;
  if(kind==="today"){ if(t.today) return false; t.today=true; t.auto=true; delete t.todayOrder; toast(`"${t.title}" is in Today.`); return true; }
  if(kind==="done"){ completeTask(t); return true; }
  let sec=null;
  if(kind==="sec") sec=secOf(id);
  if(kind==="tab"){ const cur=secOf(t.sectionId); if(cur&&cur.tabId===id) return false;
    sec=S.sections.find(x=>x.tabId===id); if(!sec){ sec={id:uid(),tabId:id,name:"General",collapsed:false}; S.sections.push(sec); } }
  if(!sec||sec.id===t.sectionId) return false;
  t.sectionId=sec.id; t.order=secTasks(sec.id).length;
  const tb=tabOf(sec.tabId); toast(`Moved to ${tb?tb.name+" · ":""}${sec.name}.`); return true;
}
function reorder(sid,ids){
  const all=secTasks(sid);
  const inList=all.filter(t=>ids.includes(t.id));
  const slots=inList.map(t=>t.order).sort((a,b)=>a-b);
  ids.forEach((id,i)=>{ const t=taskOf(id); if(t) t.order=slots[i]; });
  secTasks(sid).forEach((t,i)=>t.order=i);
}

/* ---------- actions ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, li=b.closest("li.row,li.plan-row"), t=li?taskOf(li.dataset.id):(b.closest("#focus")?taskOf(focusId):null);
  switch(act){
    case "tab": S.activeTab=b.dataset.id; addingTab=false; saveLocal(); render(); break;
    case "addTab": addingTab=true; render(); break;
    case "toggleAll": { const secs=S.sections.filter(x=>x.tabId===b.dataset.id); const anyOpen=secs.some(x=>!x.collapsed); secs.forEach(x=>x.collapsed=anyOpen); commit(); break; }
    case "collapse": { const s=secOf(b.dataset.id); s.collapsed=!s.collapsed; commit(); break; }
    case "done": if(t.done){ t.done=false; t.doneAt=null; } else completeTask(t); commitNow(); break;
    case "urgent": t.urgent=!t.urgent; commit(); break;
    case "timer": {
      askNotifPermission();
      if(S.ask&&S.ask.id===t.id) S.ask=null;
      if(t.runStart) stopTimer(t);
      else { S.brk=null; S.tasks.forEach(x=>{ if(x!==t) stopTimer(x); }); t.runStart=nowMs(); blockSeen[t.id]=Math.floor(elapsed(t)/W()); chime.prime||(chime.prime=1, (()=>{ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){} })()); }
      commitNow(); if(t.runStart) openFocus(t.id); break; }
    case "focus": openFocus(t.id); break;
    case "settings": openSettings(); break;
    case "import": openImport(); break;
    case "oldImport": importOld(); break;
    case "oldLater": oldDismiss=true; renderOldBanner(); break;
    case "signout": if(b.classList.contains("armed")){ fbAuth&&fbAuth.signOut(); } else { b.classList.add("armed"); b.textContent="Tap again to sign out"; setTimeout(()=>{ if(b.isConnected) render(); },3000); } break;
    case "theme": S.settings.theme=curTheme()==="dark"?"light":"dark"; commit(); break;
    case "fexit": closeFocus(); break;
    case "fdone": completeTask(t); closeFocus(); commitNow(); break;
    case "today": t.today=!t.today; if(t.today) t.auto=true; delete t.todayOrder; commit(); break;
    case "edit": openTask(t,b.dataset.focus); break;
    case "secMenu": openSection(secOf(b.dataset.id)); break;
    case "tabMenu": openTab(tabOf(b.dataset.id)); break;
    case "addSection": openSection(null,b.dataset.id); break;
    case "seeDone": DF.range="all"; DF.tab=b.dataset.tab; DF.sec=b.dataset.sec; S.activeTab="done"; saveLocal(); render(); break;
    case "resetUF": Object.assign(UF,{range:"all",from:"",to:"",tab:"all",sec:"all"}); render(); break;
    case "ufBy": UF.by=b.dataset.by; render(); break;
    case "resetDF": Object.assign(DF,{range:"all",from:"",to:"",tab:"all",sec:"all"}); render(); break;
    case "restore": case "delDone": {
      const dt=taskOf(b.closest("li.done-row").dataset.id); if(!dt) break;
      if(act==="restore"){ dt.done=false; dt.doneAt=null; }
      else if(b.classList.contains("armed")){ S.tasks=S.tasks.filter(x=>x!==dt); }
      else { b.classList.add("armed"); b.textContent="Delete?"; setTimeout(()=>{ if(b.isConnected){ b.classList.remove("armed"); b.textContent="✕"; } },3000); break; }
      commit(); break; }
  }
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!=="Escape") return;
  const el=e.target;
  if(el.id==="newTab"){
    if(e.key==="Escape"){ addingTab=false; render(); return; }
    const name=el.value.trim(); addingTab=false;

      S.sections.push({id:uid(),tabId:id,name:"General",collapsed:false}); S.activeTab=id; commit(); } else render();
  }
  if(el.dataset.add && e.key==="Enter"){
    const title=el.value.trim(); if(!title) return;
    const sid=el.dataset.add, n=secTasks(sid).length;
    S.tasks.push({id:uid(),sectionId:sid,title,exec:"",due:"",today:false,done:false,auto:false,order:n});

});

  document.getElementById("f-right").onclick=()=>move(1);
  armDelete(document.getElementById("f-del"),()=>{ const sids=S.sections.filter(s=>s.tabId===tab.id).map(s=>s.id);
    S.tasks=S.tasks.filter(x=>!sids.includes(x.sectionId)); S.sections=S.sections.filter(s=>s.tabId!==tab.id); S.tabs=S.tabs.filter(x=>x!==tab); S.activeTab="today"; commit(); });
  document.getElementById("f-save").onclick=ev=>{ ev.preventDefault(); const name=document.getElementById("f-tname").value.trim(); if(name) tab.name=name; tab.color=color; dlg.close(); commit(); };
  dlg.showModal();
}
function openSettings(){
  const st=S.settings||{work:10,brk:5};
  sheet.innerHTML=`<h3>Pomodoro</h3>
    <div class="two">
      <div class="field"><label for="f-work">Work (minutes)</label><input id="f-work" type="number" min="1" max="120" step="1" inputmode="numeric" value="${st.work}"></div>
      <div class="field"><label for="f-brk">Break (minutes)</label><input id="f-brk" type="number" min="1" max="60" step="1" inputmode="numeric" value="${st.brk}"></div>
    </div>
    <div class="presets"><span class="hint">Quick pick</span>${[[10,5],[15,5],[25,5],[50,10]].map(([w,b])=>`<button type="button" class="ghost" data-w="${w}" data-b="${b}">${w} / ${b}</button>`).join("")}</div>
    <p class="hint" style="margin:0">After each work block the timer pauses and your break starts. Expected time on every task updates to match, since it is counted in pomodoros.</p>
    <h3 style="margin-top:6px">Reminders</h3>
    <label class="chk"><input type="checkbox" id="f-rem" ${st.remind===false?"":"checked"}> Pop up when a task's execution time arrives and before its deadline</label>
    <div class="field"><label for="f-lead">Deadline alert</label><select id="f-lead">${[[15,"15 minutes before"],[30,"30 minutes before"],[60,"1 hour before"],[180,"3 hours before"],[1440,"1 day before"]].map(([v,l])=>`<option value="${v}" ${(st.lead||60)===v?"selected":""}>${l}</option>`).join("")}</select></div>
    ${"Notification" in window?`<button type="button" class="ghost" id="f-notif">${Notification.permission==="granted"?"Background alerts are on":"Also alert me when Gérak is in the background"}</button><span class="hint">Reminders only work while Gérak is open in a tab.</span>`:`<span class="hint">Reminders only work while Gérak is open.</span>`}
    <div class="actions"><span></span><button class="primary" id="f-save">Save</button></div>`;
  const nb=document.getElementById("f-notif"); if(nb) nb.onclick=async()=>{ try{ const r=await Notification.requestPermission(); nb.textContent=r==="granted"?"Background alerts are on":"Alerts were not allowed. Change it in your browser settings."; }catch(e){ nb.textContent="This browser can't show background alerts here."; } };
  sheet.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ document.getElementById("f-work").value=b.dataset.w; document.getElementById("f-brk").value=b.dataset.b; });
  document.getElementById("f-save").onclick=ev=>{ ev.preventDefault();
    const w=Math.min(120,Math.max(1,parseInt(document.getElementById("f-work").value,10)||10));
    const br=Math.min(60,Math.max(1,parseInt(document.getElementById("f-brk").value,10)||5));
    S.settings=Object.assign({},S.settings,{work:w,brk:br,remind:document.getElementById("f-rem").checked,lead:parseInt(document.getElementById("f-lead").value,10)||60});
    S.tasks.forEach(t=>{ blockSeen[t.id]=Math.floor(elapsed(t)/W()); });
    if(S.brk){ S.brk.end=Math.min(S.brk.end,nowMs()+B()); }
    dlg.close(); commit(); };
  dlg.showModal(); setTimeout(()=>document.getElementById("f-work").focus(),30);
}
/* ---------- import list (paste or photo) ---------- */
let IMP=null, sampleNS=null;
(async()=>{ try{ sampleNS=window.claude?.use?await claude.use("sample"):null; }catch(e){ sampleNS=null; } })();
function cleanLine(l){ return l.replace(/^\s*(?:[-*•·▪◦‣○●☐☑✓✔]|\[[ xX]?\]|\(?\d{1,3}[.)\]]|[a-zA-Z][.)])\s+/,"").replace(/\s+/g," ").trim(); }
function parsePaste(txt){ return txt.split(/\r?\n/).map(cleanLine).filter(l=>l&&l.length<=200); }
function makeCategory(dest,name){
  name=(name||"").trim(); if(!name) return null;
  if(dest==="newtab"){ const tid=uid(); S.tabs.push({id:tid,name,color:COLORS[S.tabs.length%COLORS.length]}); const sid=uid(); S.sections.push({id:sid,tabId:tid,name:"General",collapsed:false}); return sid; }
  if(dest.startsWith("newsec:")){ const sid=uid(); S.sections.push({id:sid,tabId:dest.slice(7),name,collapsed:false}); return sid; }
  return dest;
}
const isNewDest=v=>v==="newtab"||String(v).startsWith("newsec:");
function defaultDest(){ const tab=tabOf(S.activeTab); const s=(tab&&S.sections.find(x=>x.tabId===tab.id))||S.sections[0]; return s?s.id:""; }
function secOptions(sel,withNew){
  return S.tabs.map(tab=>{ const secs=S.sections.filter(s=>s.tabId===tab.id);
    return `<optgroup label="${esc(tab.name)}">${secs.map(s=>`<option value="${s.id}" ${s.id===sel?"selected":""}>${esc(tab.name)} · ${esc(s.name)}</option>`).join("")}${withNew?`<option value="newsec:${tab.id}" ${sel==="newsec:"+tab.id?"selected":""}>＋ New section in ${esc(tab.name)}</option>`:""}</optgroup>`; }).join("")
    +(withNew?`<optgroup label="New"><option value="newtab" ${sel==="newtab"?"selected":""}>＋ New tab</option></optgroup>`:"");
}
function openImport(){ IMP={step:"input",mode:"paste",text:"",file:null,url:"",busy:false,err:"",items:[],bulk:defaultDest(),today:false}; dlg.classList.add("wide"); renderImport(); dlg.showModal(); setTimeout(()=>document.getElementById("i-text")?.focus(),30); }
function renderImport(){
  if(!IMP) return;
  const canPhoto=!!sampleNS;
  if(IMP.step==="input"){
    sheet.innerHTML=`<h3>Import a list</h3>
      ${canPhoto?`<div class="seg" role="tablist">
        <button type="button" role="tab" aria-selected="${IMP.mode==="paste"}" data-imode="paste">Paste text</button>
        <button type="button" role="tab" aria-selected="${IMP.mode==="photo"}" data-imode="photo">Photo</button>
      </div>`:""}
      ${IMP.mode==="paste"?`<div class="field"><label for="i-text">One task per line</label>
        <textarea id="i-text" rows="9" placeholder="Paste from Notes, WhatsApp, email or Word&#10;- Mark C38FM quiz&#10;- Email the PhD panel&#10;- Beli telur">${esc(IMP.text)}</textarea>
        <span class="hint">Bullets, numbers and tick boxes are removed for you.</span></div>`
      :canPhoto?`<div class="field"><label for="i-file">Photo of your list</label>
        <label class="drop" for="i-file">${IMP.url?`<img src="${IMP.url}" alt="Your list">`:`<span>Tap to choose a photo or take one.<br>Handwritten is fine.</span>`}</label>
        <input id="i-file" type="file" accept="image/*" hidden>
        <span class="hint">Claude reads the photo and lists the tasks. Nothing is added until you check them.</span></div>`
      :`<p class="hint">Reading photos is not available in this view. Paste the text instead.</p>`}
      ${IMP.err?`<p class="err">${esc(IMP.err)}</p>`:""}
      <div class="actions"><button type="button" class="ghost" data-iact="cancel">Cancel</button>
        <button type="button" class="primary" data-iact="read" ${IMP.busy?"disabled":""}>${IMP.busy?"Reading your list…":"Next: check tasks"}</button></div>`;
    const ta=document.getElementById("i-text"); if(ta) ta.oninput=e=>IMP.text=e.target.value;
    const fi=document.getElementById("i-file"); if(fi) fi.onchange=e=>{ const f=e.target.files[0]; if(!f) return; IMP.file=f; IMP.err=""; if(IMP.url) URL.revokeObjectURL(IMP.url); IMP.url=URL.createObjectURL(f); renderImport(); };
    return;
  }
  const sel=IMP.items.filter(i=>i.sel).length, isNew=IMP.bulk==="newtab"||IMP.bulk.startsWith("newsec:");
  sheet.innerHTML=`<h3>Check and sort ${IMP.items.length} task${IMP.items.length===1?"":"s"}</h3>
    <div class="bulk">
      <label class="selall"><input type="checkbox" id="i-all" ${sel===IMP.items.length?"checked":""}> All</label>
      <div class="field"><label for="i-bulk">Move ${sel} selected to</label><select id="i-bulk">${secOptions(IMP.bulk,true)}</select></div>
      ${isNew?`<div class="field"><label for="i-newname">${IMP.bulk==="newtab"?"New tab name":"New section name"}</label><input id="i-newname" maxlength="40" placeholder="${IMP.bulk==="newtab"?"e.g. Home":"e.g. Admin"}"></div>`:""}
      <button type="button" class="ghost" data-iact="apply" ${sel?"":"disabled"}>Move</button>
    </div>
    <ul class="imp-list">${IMP.items.map(it=>`<li data-iid="${it.id}">
      <input type="checkbox" aria-label="Select" data-isel ${it.sel?"checked":""}>
      <input class="imp-title" value="${esc(it.title)}" aria-label="Task" data-ititle>
      <select data-idest aria-label="Where it goes">${secOptions(it.dest,true)}</select>
      <button type="button" class="icon-btn" data-iact="remove" aria-label="Remove from import">✕</button>${isNewDest(it.dest)?`<div class="imp-new"><input data-inew maxlength="40" placeholder="${it.dest==="newtab"?"New tab name":"New section name"}" aria-label="${it.dest==="newtab"?"New tab name":"New section name"}"><button type="button" class="ghost" data-iact="inew">Create</button></div>`:""}</li>`).join("")}</ul>
    <label class="selall"><input type="checkbox" id="i-today" ${IMP.today?"checked":""}> Also put these in Today</label>
    <div class="actions"><button type="button" class="ghost" data-iact="back">Back</button>
      <button type="button" class="primary" data-iact="add" ${IMP.items.length?"":"disabled"}>Add ${IMP.items.length} task${IMP.items.length===1?"":"s"}</button></div>`;
  document.getElementById("i-bulk").onchange=e=>{ IMP.bulk=e.target.value; renderImport(); if(IMP.bulk==="newtab"||IMP.bulk.startsWith("newsec:")) document.getElementById("i-newname")?.focus(); };
  document.getElementById("i-all").onchange=e=>{ IMP.items.forEach(i=>i.sel=e.target.checked); renderImport(); };
  document.getElementById("i-today").onchange=e=>IMP.today=e.target.checked;
  sheet.querySelectorAll(".imp-list li").forEach(li=>{ const it=IMP.items.find(x=>x.id===li.dataset.iid);
    li.querySelector("[data-isel]").onchange=e=>{ it.sel=e.target.checked; renderImport(); };
    li.querySelector("[data-ititle]").oninput=e=>it.title=e.target.value;
    li.querySelector("[data-idest]").onchange=e=>{ it.dest=e.target.value; renderImport(); if(isNewDest(it.dest)) sheet.querySelector(`li[data-iid="${it.id}"] [data-inew]`)?.focus(); }; });
}
async function shrink(file){
  try{ const bmp=await createImageBitmap(file); const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85)); }catch(e){ return file; }
}
function toReview(lines){
  const d=defaultDest(); IMP.items=lines.map(t=>({id:uid(),title:t,sel:true,dest:d})); IMP.bulk=d; IMP.step="review"; IMP.err=""; renderImport();
}
sheet.addEventListener("click",async e=>{
  if(!IMP) return;
  const m=e.target.closest("[data-imode]"); if(m){ IMP.mode=m.dataset.imode; IMP.err=""; renderImport(); return; }
  const b=e.target.closest("[data-iact]"); if(!b) return; e.preventDefault();
  const a=b.dataset.iact;
  if(a==="cancel"){ dlg.close(); return; }
  if(a==="back"){ IMP.step="input"; renderImport(); return; }
  if(a==="read"){
    if(IMP.mode==="paste"){ const lines=parsePaste(IMP.text); if(!lines.length){ IMP.err="Paste at least one task, one per line."; renderImport(); return; } toReview(lines); return; }
    if(!IMP.file){ IMP.err="Choose a photo first."; renderImport(); return; }
    IMP.busy=true; IMP.err=""; renderImport();
    try{
      const img=await shrink(IMP.file);
      const out=await sampleNS.json(`Read this photo of a to-do list. It may be handwritten and may mix Malay and English.
Return only JSON in this shape: {"tasks":["task one","task two"]}.
Rules: one entry per task, in the order written. Keep the writer's own words and language; fix only obvious misreadings. Remove bullets, numbers, tick boxes and arrows. Skip headings, dates and anything crossed out. If nothing readable, return {"tasks":[]}.`,{images:[img],modelTier:"default",cache:false});
      const tasks=(Array.isArray(out)?out:out?.tasks||[]).map(x=>cleanLine(String(x))).filter(Boolean);
      IMP.busy=false;
      if(!tasks.length){ IMP.err="No tasks found in that photo. Try a clearer, closer photo, or paste the text."; renderImport(); return; }
      toReview(tasks);
    }catch(err){
      IMP.busy=false;
      const c=err&&err.code;
      IMP.err=c==="not_granted"?"Photo reading needs your permission. Allow Claude for this page when asked, or paste the text instead."
        :c==="rate_limited"?"Too many photos just now. Wait a minute and try again."
        :c==="images_unavailable"?"This view can't send photos. Paste the text instead."
        :c==="cancelled"?"":"Couldn't read that photo. Try a clearer photo, or paste the text.";
      renderImport();
    }
    return;
  }
  if(a==="inew"){ const li=b.closest("li"), it=IMP.items.find(x=>x.id===li.dataset.iid);
    const made=makeCategory(it.dest,li.querySelector("[data-inew]").value); if(!made){ li.querySelector("[data-inew]").focus(); return; }
    it.dest=made; commit(); renderImport(); return; }
  if(a==="remove"){ const id=b.closest("li").dataset.iid; IMP.items=IMP.items.filter(i=>i.id!==id); renderImport(); return; }
  if(a==="apply"){
    let dest=IMP.bulk;
    if(dest==="newtab"||dest.startsWith("newsec:")){
      const name=(document.getElementById("i-newname")?.value||"").trim();
      if(!name){ document.getElementById("i-newname")?.focus(); return; }
      if(dest==="newtab"){ const tid=uid(); S.tabs.push({id:tid,name,color:COLORS[S.tabs.length%COLORS.length]}); dest=uid(); S.sections.push({id:dest,tabId:tid,name:"General",collapsed:false}); }
      else { const tid=dest.slice(7); dest=uid(); S.sections.push({id:dest,tabId:tid,name,collapsed:false}); }
      commit();
    }
    IMP.items.forEach(i=>{ if(i.sel){ i.dest=dest; i.sel=false; } });
    IMP.bulk=dest; renderImport(); return;
  }
  if(a==="add"){
    const pend=IMP.items.find(i=>isNewDest(i.dest));
    if(pend){ const inp=sheet.querySelector(`li[data-iid="${pend.id}"] [data-inew]`); const made=makeCategory(pend.dest,inp?.value);
      if(!made){ inp?.focus(); toast("Type a name for the new category, then tap Create."); return; }
      IMP.items.forEach(i=>{ if(i.dest===pend.dest) i.dest=made; }); }
    if(IMP.items.some(i=>isNewDest(i.dest))){ renderImport(); toast("Name each new category first."); return; }
    let n=0;
    for(const it of IMP.items){ const title=it.title.trim(); if(!title||!secOf(it.dest)) continue;
      S.tasks.push({id:uid(),sectionId:it.dest,title,exec:"",due:"",today:!!IMP.today,done:false,auto:!!IMP.today,order:secTasks(it.dest).length,spent:0}); n++; }
    dlg.close(); commit(); toast(`Added ${n} task${n===1?"":"s"}.`); return;
  }
});
sheet.addEventListener("keydown",e=>{ if(IMP&&e.key==="Enter"&&e.target.tagName==="INPUT"){ e.preventDefault(); } });
dlg.addEventListener("close",()=>{ dlg.classList.remove("wide"); if(IMP?.url) URL.revokeObjectURL(IMP.url); IMP=null; });

dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });

/* ---------- boot ---------- */
S=FB_ON?starterPublic():(loadLocal()||starter());
normalize();
if(autoToday()) saveLocal();
if(FB_ON){ showGate(true); document.getElementById("gateBtn").onclick=signIn; } else render();
connect();
setInterval(()=>{ if(autoToday()) commit(); else if(!dlg.open&&!document.activeElement?.matches("input")) render(); },60000);
})();
</script>
